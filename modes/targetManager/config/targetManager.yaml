#config_version=6

mode:
  start_events: start-mode-targetManager
  stop_events: stop-mode-targetManager
  priority: 160

shots:
  magicMShot:
    switch: sMTarget
    profile: magicProfile
    show_tokens:
      lights: magicMInsert
      color: 880088
  magicAShot:
    switch: sATarget
    profile: magicProfile
    show_tokens:
      lights: magicAInsert
      color: 880088
  magicGShot:
    switch: sGTarget
    profile: magicProfile
    show_tokens:
      lights: magicGInsert
      color: 880088
  magicIShot:
    switch: sITarget
    profile: magicProfile
    show_tokens:
      lights: magicIInsert
      color: 880088
  magicCShot:
    switch: sCTarget
    profile: magicProfile
    show_tokens:
      lights: magicCInsert
      color: 880088

shot_groups:
  magicGroup:
    shots: magicMShot, magicAShot, magicGShot, magicIShot, magicCShot
    reset_events: magicGroup_hit_complete

shot_profiles:
  magicProfile:
    states:
      - name:
        show: flicker_color_off
        loops: -1
        speed: 3
        sync_ms: 0
      - name: hit
        show: flicker_color_on
        loops: -1
        speed: 3
        sync_ms: 0

variable_player:
  magicMShot_hit:
    score: 1_000
  magicAShot_hit:
    score: 1_000
  magicGShot_hit:
    score: 1_000
  magicIShot_hit:
    score: 1_000
  magicCShot_hit:
    score: 1_000
  magicGroup_hit_complete:
    score: 10_000
    bonus_multiplier: 1
