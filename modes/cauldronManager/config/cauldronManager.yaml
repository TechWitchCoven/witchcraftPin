#config_version=6

mode:
  start_events: start-mode-cauldronManager
  stop_events: stop-mode-cauldronManager
  priority: 155

sequence_shots:
  left_ramp:
    switch_sequence: sCauldronLeftOpto,sCauldronLeftProx
    sequence_timeout: 1s
    allow_multiple_active: true
  right_ramp:
    switch_sequence: sCauldronRightOpto,sCauldronRightProx
    sequence_timeout: 1s
    allow_multiple_active: true

timers:
  motionTick:
    end_value: 1
    tick_interval: 5s
    start_running: true
    control_events:
      - event: resetTickTimer
        action: restart

event_player:
  timer_motionTick_complete:
    - cauldronOneTickForward
    - bumperOneTickReverse
    - resetTickTimer

  cauldronManager_will_stop:
    - cauldronStop
    - bumperStop