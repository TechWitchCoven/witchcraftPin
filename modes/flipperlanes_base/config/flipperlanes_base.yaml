#config_version=6

mode:
  start_events: start-mode-flipperlanes-base
  stop_events: stop-mode-flipperlanes-base, ball_will_end
  priority: 150

shots:
  leftInnerLane:
    switch: sLeftInlane
    profile: bindLaneProfile
    show_tokens:
      led: iInsert
  leftOuterLane:
    switch: sLeftOutlane
    profile: bindLaneProfile
    show_tokens:
      led: bInsert
  rightInnerLane:
    switch: sRightInlane
    profile: bindLaneProfile
    show_tokens:
      led: nInsert
  rightOuterLane:
    switch: sRightOutlane
    profile: bindLaneProfile
    show_tokens:
      led: dInsert

shot_groups:
  bindLaneGroup:
    shots: leftOuterLane, leftInnerLane, rightInnerLane, rightOuterLane
    rotate_left_events: sLeftFlipperButton_active
    rotate_right_events: sRightFlipperButton_active
    reset_events: bindLaneGroup_hit_complete

shot_profiles:
  bindLaneProfile:
    states:
      - name: hit
        show: flicker_color_on
        loops: -1
        speed: 3
        sync_ms: 0
      - name:
        show: flicker_color_off
        loops: -1
        speed: 3
        sync_ms: 0

variable_player:
  leftInnerLane_hit:
    score: 1_000
  leftOuterLane_hit:
    score: 1_000
  rightInnerLane_hit:
    score: 1_000
  rightOuterLane_hit:
    score: 1_000
  bindLaneGroup_hit_complete:
    score: 10_000
    bonus_multiplier: 1