#config_version=6

# This is the mode definition for the base game mode. Other Modes
# are called from this mode for running of the game

# The following is the mode config data
# It contains the start event, based on the defined start event,
# and corresponding stop event.  The priority is 100 for this mode
mode:
  start_events: ball_started
  stop_events: ball_ending
  priority: 100

# The following defines what slides will be played in this mode
slide_player:

  # Slides are defined as follows: 
  # Event used to call Slide: Slide to be Shown
  mode_base_started: base

# The following Defines the events that will be called from this mode
event_player:

  # Events are defined as follows:
  # Name of Event to Listen For:
  #   - Name of Event to Call After Listened Event Occurs{Conditional Statement} 
  mode_base_started:
    - start-mode-flipperlanes-base
    - start-mode-global
    - start-mode-targetManager
    - start-mode-cauldronManager
    - start-mode-ballSaveManager
    - start-mode-springManager
  mode_base_will_stop:
    - stop-mode-flipperlanes-base
    - stop-mode-global
    - stop-mode-targetManager
    - stop-mode-cauldronManager
    - stop-mode-ballSaveManager
    - start-mode-springManager
  player_score{value>=50_000_000}:
    - scoreGreaterFiftyMillion

variable_player:
  mode_base_started:
    switchesHit:
      int: 0
      action: set
    rimOrbits:
      int: 0
      action: set
    iboundTargets:
      int: 0
      action: set
    iOverallPlayfieldMultiplier:
      int: 1
      action: set
    iTempPlayfieldMultiplier:
      int: 1
      action: set
    iMagicMBoundTarget:
      int: 1
      action: set
    iMagicABoundTarget:
      int: 1
      action: set
    iMagicGBoundTarget:
      int: 1
      action: set
    iMagicIBoundTarget:
      int: 1
      action: set
    iMagicCBoundTarget:
      int: 1
      action: set
    iBindBBoundTarget:
      int: 1
      action: set
    iBindIBoundTarget:
      int: 1
      action: set
    iBindNBoundTarget:
      int: 1
      action: set
    iBindDBoundTarget:
      int: 1
      action: set
  activateBasicRegenPotion:
    score: 10_000_000
  activateLegendaryRegenPotion:
    score: 50_000_000
  activateBasicStrengthPotion:
    iTempPlayfieldMultiplier:
      int: 2
      action: set
  activateRareStrengthPotion:
    iOverallPlayfieldMultiplier:
      int: 2
      action: set
  activateRareLegendaryPotion:
    iOverallPlayfieldMultiplier:
      int: 4
      action: set
  player_turn_starting:
    iTempPlayfieldMultiplier:
      int: 1
      action: set

# The following defines the timers in this mode
timers:

  # Timers are named and defined as such:
  # Name of Timer:
  #   end_value: Final Value in Timer
  #   tick_interval: Length of Tick
  #   start_running: Should the timer be running immediately/when enabled
  #   control_events:
  #     - event: Name of Event to Call Timer Control Event
  #       action: Type of Control Event to be Peformed (stop/restart)

  # The following timer acts as the primary clock related to motion events for the cauldron
  # since motor devices have a time off for FAST EXP Boards. This primary clock will "tick"
  # every 5 seconds and initiate an event to call another motion event as long as this
  # mode is running.
  waitingTimer:
    end_value: 1
    tick_interval: 15s
    start_running: false
    control_events:
      - event: sPlungerLane_active
        action: restart
      - event: sPlungerLane_inactive
        action: stop

widget_player:
  player_added: 
    playerAdded:
      expire: 1000ms

sound_player:
  player_added{num==2}:
    player2AddedAsset:
      action: play
  player_added{num==3}:
    player3AddedAsset:
      action: play
  player_added{num==4}:
    player4AddedAsset:
      action: play
  timer_waitingTimer_complete:
    whatAreYouWaitingForAsset:
      action: play
  player_1_ball_started:
    player1UpAsset:
      action: play
  player_2_ball_started:
    player2UpAsset:
      action: play
  player_3_ball_started:
    player3UpAsset:
      action: play
  player_4_ball_started:
    player4UpAsset:
      action: play

achievements:
  speedPotionAchievement:
    complete_events: speedPotionBrewComplete
    enable_events: speedPotionAttempt
  healingPotionAchievement:
    complete_events: healingPotionBrewComplete
    enable_events: healingPotionAttempt
  regenPotionAchievement:
    complete_events: regenPotionBrewComplete
    enable_events: regenPotionAttempt
  strengthPotionAchievement:
    complete_events: strengthPotionBrewComplete
    enable_events: strengthPotionAttempt

extra_balls:
  tier2StrengthExtraBall:
    award_events: activateRareRegenPotion,activateLegendaryRegenPotion
  fiftyMillionExtraBall:
    award_events: scoreGreaterFiftyMillion
  

