#config_version=6

# This is the mode definition for the Speed Potion Brewing mode. It is used
# to manage the brewing and show related to brewing a speed potion.

# The following is the mode config data
# It contains the start event, based on the defined start event,
# and corresponding stop event.  The priority is 700 for this mode
mode:
  start_events: start-mode-potionRegenBrewing
  stop_events: stop-mode-potionRegenBrewing
  priority: 720

# The following contains the definitions for shows to be played in this mode
show_player:

  # Show cues are based on events being called, they are defined as such:
  # Event to Call Show:
  #   Name of Show To Play:
  #     speed: Speed of Show Playback
  #     color: Color to use for Show
  #     tip, base, center: Specific tags for the shotArrowForward Show to use
  #                        in order to call the different parts of the arrow 
  #                        playfield insert
  mode_potionRegenBrewing_started:
    shotArrowForward:
      speed: 2
      show_tokens:
        tip: webTipInsert
        center: webCenterInsert
        base: webBaseInsert
        color: DeepPink
  logicblock_regenPotionBrewSequence_updated{value==1}:
    shotArrowForward:
      speed: 2
      show_tokens:
        tip: batWingTipInsert
        center: batWingCenterInsert
        base: batWingBaseInsert
        color: DeepPink
    off:
      show_tokens: 
        lights: webTipInsert,webCenterInsert,webBaseInsert
  logicblock_regenPotionBrewSequence_updated{value==2}:
    shotArrowForward:
      speed: 2
      show_tokens:
        tip: ravenFeatherTipInsert
        center: ravenFeatherCenterInsert
        base: ravenFeatherBaseInsert
        color: DeepPink
    off:
      show_tokens: 
        lights: batWingTipInsert,batWingCenterInsert,batWingBaseInsert
      
  #Fourth Ingredient
  logicblock_regenPotionBrewSequence_updated{value==3}:
    shotArrowForward:
      speed: 2
      show_tokens:
        tip: dragonScaleTipInsert
        center: dragonScaleCenterInsert
        base: dragonScaleBaseInsert
        color: DeepPink
    off:
      show_tokens: 
        lights: ravenFeatherBaseInsert,ravenFeatherCenterInsert,ravenFeatherTipInsert
  
  #Fifth Ingredient
  logicblock_regenPotionBrewSequence_updated{value==4}:
    shotArrowForward:
      speed: 2
      show_tokens:
        tip: webTipInsert
        center: webCenterInsert
        base: webBaseInsert
        color: DeepPink
    off:
      show_tokens: 
        lights: dragonScaleBaseInsert,dragonScaleCenterInsert,dragonScaleTipInsert
  logicblock_regenPotionBrewSequence_updated{value==0}:
    shotArrowForward:
      speed: 2
      show_tokens:
        tip: webTipInsert
        center: webCenterInsert
        base: webBaseInsert
        color: DeepPink
    off:
      show_tokens: 
        lights: batWingTipInsert,batWingCenterInsert,batWingBaseInsert,ravenFeatherBaseInsert,ravenFeatherCenterInsert,ravenFeatherTipInsert,dragonScaleBaseInsert,dragonScaleCenterInsert,dragonScaleTipInsert

  player_iRegenPotionCurrentStep{value==0}:
    off:
      show_tokens:
        lights: potionInsert1u,potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
  player_iRegenPotionCurrentStep{value==0 and current_player.iRegenPotionMaxStep==1}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1l
        offLights: potionInsert1u,potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==0 and current_player.iRegenPotionMaxStep==2}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert2l, potionInsert1l
        offLights: potionInsert1u,potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==0 and current_player.iRegenPotionMaxStep==3}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert3l, potionInsert2l, potionInsert1l
        offLights: potionInsert1u,potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==0 and current_player.iRegenPotionMaxStep==4}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert4l, potionInsert3l, potionInsert2l, potionInsert1l
        offLights: potionInsert1u,potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==1 and current_player.iRegenPotionMaxStep==1}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1
        offLights: potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==1 and current_player.iRegenPotionMaxStep==2}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2l
        offLights: potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==1 and current_player.iRegenPotionMaxStep==3}:
   brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2l,potionInsert3l
        offLights: potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==1 and current_player.iRegenPotionMaxStep==4}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2l,potionInsert3l,potionInsert4l
        offLights: potionInsert2u,potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==2 and current_player.iRegenPotionMaxStep==2}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2
        offLights: potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==2 and current_player.iRegenPotionMaxStep==3}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2,potionInsert3l
        offLights: potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==2 and current_player.iRegenPotionMaxStep==4}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2,potionInsert3l,potionInsert4l
        offLights: potionInsert3u,potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==3 and current_player.iRegenPotionMaxStep==3}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2,potionInsert3
        offLights: potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==3 and current_player.iRegenPotionMaxStep==4}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert1,potionInsert2,potionInsert3,potionInsert4l
        offLights: potionInsert4u,potionInsert5u
        color: DeepPink
  player_iRegenPotionCurrentStep{value==4}:
    brewTrackerShow:
      show_tokens:
        onLights: potionInsert4, potionInsert3, potionInsert2, potionInsert1
        color: DeepPink
  
  logicblock_regenPotionBrewSequence_complete:
    rippleOn:
      loops: 3
      speed: 4
      show_tokens:
        color: DeepPink
        target: potionInsert3
        targetm1: potionInsert2
        targetm2: potionInsert1
        targetp1: potionInsert4
        targetp2: potionInsert5    

      
  
# The following defines the timers in this mode
timers:

  # Timers are named and defined as such:
  # Name of Timer:
  #   end_value: Final Value in Timer
  #   tick_interval: Length of Tick
  #   start_running: Should the timer be running immediately/when enabled
  #   control_events:
  #     - event: Name of Event to Call Timer Control Event
  #       action: Type of Control Event to be Peformed (stop/restart)
  regenPotionBrewingTimer:
    end_value: 120
    tick_interval: 500ms
    start_running: true

# The following Defines the events that will be called from this mode
event_player:

  # Events are defined as follows:
  # Name of Event to Listen For:
  #   - Name of Event to Call After Listened Event Occurs 
  mode_potionRegenBrewing_started:
    - regenPotionAttempt
  logicblock_regenPotionBrewSequence_complete:
    - stop-mode-potionRegenBrewing
    - resetPotionQualifer
    - activateLegendaryRegenPotion
    - regenPotionBrewComplete
  timer_regenPotionBrewingTimer_complete:
    - stop-mode-potionRegenBrewing
    - resetPotionQualifer
    - activateBasicRegenPotion{current_player.iRegenPotionMaxStep==1}
    - activateRareRegenPotion{current_player.iRegenPotionMaxStep==3}
    - regenPotionBrewComplete
  dragonScaleIngredientAdd_hit{current_player.iRegenPotionCurrentStep!=3}:
    - resetPotionSequencer
  batWingIngredientAdd_hit{current_player.iRegenPotionCurrentStep!=1}:
    - resetPotionSequencer

variable_player:
  mode_potionRegenBrewing_started:
    iRegenPotionCurrentStep:
      int: 0
      action: set
    iRegenPotionMaxStep:
      int: 0
      action: set
  logicblock_regenPotionBrewSequence_complete:
    iRegenPotionCurrentStep:
      int: 5
      action: set
    iRegenPotionMaxStep:
      int: 5
      action: set
  logicblock_regenPotionBrewSequence_updated{value==0}:
    iRegenPotionCurrentStep:
      int: 0
      action: set
  logicblock_regenPotionBrewSequence_updated{value==1}:
    iRegenPotionCurrentStep:
      int: 1
      action: set
  logicblock_regenPotionBrewSequence_updated{value==1 and current_player.iRegenPotionMaxStep<1}:
    iRegenPotionMaxStep:
      int: 1
      action: set
  logicblock_regenPotionBrewSequence_updated{value==2}:
    iRegenPotionCurrentStep:
      int: 2
      action: set
  logicblock_regenPotionBrewSequence_updated{value==2 and current_player.iRegenPotionMaxStep<2}:
    iRegenPotionMaxStep:
      int: 2
      action: set
  logicblock_regenPotionBrewSequence_updated{value==3}:
    iRegenPotionCurrentStep:
      int: 3
      action: set
  logicblock_regenPotionBrewSequence_updated{value==3 and current_player.iRegenPotionMaxStep<3}:
    iRegenPotionMaxStep:
      int: 3
      action: set
  logicblock_regenPotionBrewSequence_updated{value==4}:
    iRegenPotionCurrentStep:
      int: 4
      action: set
  logicblock_regenPotionBrewSequence_updated{value==4 and current_player.iRegenPotionMaxStep<4}:
    iRegenPotionMaxStep:
      int: 4
      action: set

sequences:
  regenPotionBrewSequence:
    events:
      - webIngredientAdd_hit #webOrbit
      - batWingIngredientAdd_hit #batWing
      - ravenFeatherIngredientAdd_hit #ravenfeatherOrbit
      - dragonScaleIngredientAdd_hit #dragonscale
      - webIngredientAdd_hit #webOrbit
    reset_events: resetPotionSequencer
