#config_version=6

hardware:
    platform: fast, virtual

fast:
    net:
        controller: neuron
        port: /dev/ttyAMA2
        io_loop:
            cabio:
                model: FP-I/O-0024
                order: 1
            pio1:
                model: FP-I/O-3208
                order: 2
            pio2:
                model: FP-I/O-3208
                order: 3
        baud: 921600
        debug: false
        watchdog: 1s
        default_quick_debounce_open: 2ms
        default_quick_debounce_close: 2ms
        default_normal_debounce_open: 4ms
        default_normal_debounce_close: 4ms
    exp:
        port: /dev/ttyAMA4
        boards:
            lowerpfexp:
                model: FP-EXP-0081
                led_fade_time: 10ms
            upperpfexp:
                model: FP-EXP-0051
                led_fade_time: 10ms
        baud: 921600
    exp_int:
        port: /dev/ttyAMA3
        boards:
            neuron:
                model: FP-EXP-2000
        baud: 921600
    aud:
        port: /dev/ttyACM0
        main_amp_enabled: true
        sub_amp_enabled: false
        headphones_amp_enabled: false

        main_steps: 20
        sub_steps: 20
        headphones_steps: 20

        default_main_volume: 32
        default_sub_volume: 32
        default_headphones_volume: 12

        persist_volume_settings: true

        max_hw_volume_main: 63
        max_hw_volume_sub: 63
        max_hw_volume_headphones: 63

        main_levels_list: None
        sub_levels_list: None
        headphones_levels_list: None

        link_sub_to_main: true
        link_headphones_to_main: false

        headphones_level: headphones
        mute_speakers_with_headphones: true
