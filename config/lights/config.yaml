#config_version=6

#This combines the configs for the different EXP board light configs into this file
config:
  - lowerPlayfieldEXPConfig.yaml
  - upperPlayfieldEXPConfig.yaml
  - playfieldExternalEXPConfig.yaml

#Definition of Start Button coil Driver to LED Mapping
lights:
  startLight:
    number: cStartButtonLED
    platform: drivers
    type: r
  actionButtonBlueLED:
    number: cActionButtonBlueLED
    platform: drivers
    type: b
    tags: actionButtonLight
  actionButtonRedLED:
    number: cActionButtonRedLED
    platform: drivers
    type: r
    tags: actionButtonLight
  actionButtonGreenLED:
    number: cActionButtonGreenLED
    platform: drivers
    type: g
    tags: actionButtonLight

light_stripes:
  transliteTopLights:
    count: 32
    number_template: neuron-3-{}
    light_template:
      tags: translite
    number_start: 1
  transliteBottomLights:
    count: 32
    number_template: neuron-4-{}
    light_template:
      tags: translite
    number_start: 1