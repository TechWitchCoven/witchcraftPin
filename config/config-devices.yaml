#config_version=6

flippers:
  leftFlipper:
    main_coil: cLeftFlipperPower
    hold_coil: cLeftFlipperHold
    activation_switch: sLeftFlipperButton
    eos_switch: sLeftFlipperEOS
    use_eos: true
  rightFlipper:
    main_coil: cRightFlipperPower
    hold_coil: cRightFlipperHold
    activation_switch: sRightFlipperButton
    eos_switch: sRightFlipperEOS
    use_eos: true

ball_devices:
  bdTrough:
    ball_switches: sBall1,sBall2,sBall3,sBall4,sBall5,sBall6
    eject_coil: cBallTroughEject
    tags: trough, home, drain
    jam_switch: sBallJam
    eject_coil_jam_pulse: 15ms
    eject_targets: bdPlunger
  bdPlunger:
    ball_switches: sPlungerLane
    entrance_count_delay: 300ms
    eject_timeouts: 3s
    eject_coil: cAutoPlunger
    mechanical_eject: true

autofire_coils:
  rightSlingUpper:
    coil: cRightSling
    switch: sRightSlingUpper
  rightSlingLower:
    coil: cRightSling
    switch: sRightSlingLower
  leftSlingUpper:
    coil: cLeftSling
    switch: sLeftSlingUpper
  leftSlingLower:
    coil: cLeftSling
    switch: sLeftSlingLower

spinners:
  leftFireSpinner:
    switch: sCauldronLeftSpinner
    active_ms: 500
  rightFireSpinner:
    switch: sCauldronRightSpinner
    active_ms: 500

drop_targets:
  leftCrystal:
    switch: sCrystalLeftTarget
  centerCrystal:
    switch: sCrystalCenterTarget
  rightCrystal:
    switch: sCrystalRightTarget

drop_target_banks:
  crystalBank:
    drop_targets: leftCrystal, centerCrystal, rightCrystal
    reset_coils: cSpring3Reset
    reset_events: machine_reset_phase_3, ball_starting