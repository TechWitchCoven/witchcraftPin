#config_version=6

hardware:
    platform: fast

fast:
    net:
        controller: neuron
        port: /dev/ttyAMA2
        io_loop:
            pio1:
                model: FP-I/O-3208
                order: 1
            pio2:
                model: FP-I/O-3208
                order: 2
            cabio:
                model: FP-I/O-0024
                order: 3
        baud: 921600
        debug: false
        watchdog: 1s
        default_quick_debounce_open: 2ms
        default_quick_debounce_close: 2ms
        default_normal_debounce_open: 4ms
        default_normal_debounce_close: 4ms

switches:
    sLeftFlipperEOS:
        number: pio1-31
        type: NC
        debounce: quick
    sRightFlipperEOS:
        number: pio1-15
        type: NC
        debounce: quick
    sPlungerLane:
        number: pio1-0
        platform_settings:
            debounce_open: 5ms
            debounce_close: 20ms
    sLeftFlipperButton:
        number: cabio-8
        debounce: quick
    sRightFlipperButton:
        number: cabio-16
        debounce: quick
    sRightSlingUpper:
        number: pio1-13
    sRightSlingLower:
        number: pio1-14
    sLeftSlingUpper:
        number: pio1-29
        debounce: quick
    sLeftSlingLower:
        number: pio1-30       
        debounce: quick
    sBallJam:
        number: pio1-2
        type: NC
    sBall1:
        number: pio1-1
        type: NC
    s1PopTarget:
        number: pio2-28
        tags: playfield_active
    sStartButton:
        number: cabio-9
        tags: start
    sPlungerButton:
        number: cabio-10

coils:
    c_ball_trough:
        number: pio1-2
        default_pulse_ms: 15
        platform_settings:
            recycle_ms: 10ms
            pwm2_ms: 15ms
    c_left_flipper_main:
        number: pio1-1
        default_pulse_ms: 25
    c_left_flipper_hold:
        number: pio1-0
        allow_enable: true
    c_right_flipper_main:
        number: pio1-7
        default_pulse_ms: 25
    c_right_flipper_hold:
        number: pio1-6
        allow_enable: true
    c_left_kicker:
        number: pio1-4
        default_pulse_ms: 18
        platform_settings:
            recycle_ms: 40
    c_right_kicker:
        number: pio1-5
        default_pulse_ms: 18
        platform_settings:
            recycle_ms: 40
    c_auto_plung:
        number: pio1-3

flippers:
    left_flipper:
        main_coil: c_left_flipper_main
        hold_coil: c_left_flipper_hold
        activation_switch: sLeftFlipperButton
        eos_switch: sLeftFlipperEOS
        use_eos: true
    right_flipper:
        main_coil: c_right_flipper_main
        hold_coil: c_right_flipper_hold
        activation_switch: sRightFlipperButton
        eos_switch: sRightFlipperEOS
        use_eos: true

ball_devices:
    bd_trough:
        ball_switches: sBall1
        eject_coil: c_ball_trough
        tags: trough, home, drain
        jam_switch: sBallJam
        eject_coil_jam_pulse: 15ms
        eject_targets: bd_plunger
    bd_plunger:
        ball_switches: sPlungerLane
        entrance_count_delay: 300ms
        eject_timeouts: 3s
        eject_coil: c_auto_plung
        mechanical_eject: true
        player_controlled_eject_event: sPlungerButton_active

autofire_coils:
    right_kicker:
        coil: c_right_kicker
        switch: sRightSlingUpper
        enable_events: machine_reset_phase_3
    right_kicker_lower:
        coil: c_right_kicker
        switch: sRightSlingLower
        enable_events: machine_reset_phase_3
    left_kicker:
        coil: c_left_kicker
        switch: sLeftSlingUpper
        enable_events: machine_reset_phase_3
    left_kicker_lower:
        coil: c_left_kicker
        switch: sLeftSlingLower
        enable_events: machine_reset_phase_3

playfields:
    playfield:
        tags: default
        default_source_device: bd_plunger
    

        