#config_version=6

config:
    - config-hardware.yaml
    - config-switches.yaml

modes:
    - service


coils:
    cBallTroughEject:
        number: pio1-2
        default_pulse_ms: 15
        platform_settings:
            recycle_ms: 10ms
            pwm2_ms: 15ms
    cLeftFlipperPower:
        number: pio1-1
        default_pulse_ms: 25
    cLeftFlipperHold:
        number: pio1-0
        allow_enable: true
    cRightFlipperPower:
        number: pio1-7
        default_pulse_ms: 25
    cRightFlipperHold:
        number: pio1-6
        allow_enable: true
    cLeftSling:
        number: pio1-4
        default_pulse_ms: 18
        platform_settings:
            recycle_ms: 40
    cRightSling:
        number: pio1-5
        default_pulse_ms: 18
        platform_settings:
            recycle_ms: 40
    cAutoPlunger:
        number: pio1-3
    cSinglePopTarget:
        number: pio2-7

flippers:
    leftFlipper:
        main_coil: cLeftFlipperPower
        hold_coil: cLeftFlipperHold
        activation_switch: sLeftFlipperButton
        eos_switch: sLeftFlipperEOS
        use_eos: true
    rightFlipper:
        main_coil: cRightFlipperPower
        hold_coil: cRightFlipperHold
        activation_switch: sRightFlipperButton
        eos_switch: sRightFlipperEOS
        use_eos: true

ball_devices:
    bdTrough:
        ball_switches: sBall1,sBall2,sBall3,sBall4,sBall5,sBall6
        eject_coil: cBallTroughEject
        tags: trough, home, drain
        jam_switch: sBallJam
        eject_coil_jam_pulse: 15ms
        eject_targets: bdPlunger
    bdPlunger:
        ball_switches: sPlungerLane
        entrance_count_delay: 300ms
        eject_timeouts: 3s
        eject_coil: cAutoPlunger
        mechanical_eject: true
        player_controlled_eject_event: sPlungerButton_active

autofire_coils:
    rightSlingUpper:
        coil: cRightSling
        switch: sRightSlingUpper
    rightSlingLower:
        coil: cRightSling
        switch: sRightSlingLower
    leftSlingUpper:
        coil: cLeftSling
        switch: sLeftSlingUpper
    leftSlingLower:
        coil: cLeftSling
        switch: sLeftSlingLower

playfields:
    playfield:
        tags: default
        default_source_device: bdPlunger

settings:
    replay_score:
        label: Replay replay_score
        values:
            500000: "500000 (default)"
            1000000: "1000000"
            1500000: "1500000"
        default: 500000
        key_type: int
        sort: 100    

        