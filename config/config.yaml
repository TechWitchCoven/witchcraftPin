#config_version=6

hardware:
    platform: fast

fast:
    net:
        controller: neuron
        port: /dev/ttyAMA2
        io_loop:
            pio1:
                model: FP-I/O-3208
                order: 1
            pio2:
                model: FP-I/O-3208
                order: 2
            cabio:
                model: FP-I/O-0024
                order: 3
        baud: 921600
        debug: false
        watchdog: 1s
        default_quick_debounce_open: 2ms
        default_quick_debounce_close: 2ms
        default_normal_debounce_open: 4ms
        default_normal_debounce_close: 4ms

switches:
    s_left_flipper_eos:
        number: pio1-31
        type: NC
        debounce: quick
    s_right_flipper_eos:
        number: pio1-15
        type: NC
        debounce: quick
    s_auto_plung:
        number: pio1-0
        platform_settings:
            debounce_open: 5ms
            debounce_close: 20ms
    s_left_flipper:
        number: cabio-8
        debounce: quick
    s_right_flipper:
        number: cabio-16
        debounce: quick
    s_right_kicker_upper:
        number: pio1-13
    s_right_kicker_lower:
        number: pio1-14
    s_left_kicker_upper:
        number: pio1-29
        debounce: quick
    s_left_kicker_lower:
        number: pio1-30       
        debounce: quick
    s_ball_jam:
        number: pio1-2
        type: NC
    s_ball1:
        number: pio1-1
        type: NC
    s_poptarget1:
        number: pio2-28
        tags: playfield_active
    s_start:
        number: cabio-9
        tags: start
    s_plunger:
        number: cabio-10

coils:
    c_ball_trough:
        number: pio1-2
        default_pulse_ms: 15
        platform_settings:
            recycle_ms: 10ms
            pwm2_ms: 15ms
    c_left_flipper_main:
        number: pio1-1
        default_pulse_ms: 25
    c_left_flipper_hold:
        number: pio1-0
        allow_enable: true
    c_right_flipper_main:
        number: pio1-7
        default_pulse_ms: 25
    c_right_flipper_hold:
        number: pio1-6
        allow_enable: true
    c_left_kicker:
        number: pio1-4
        default_pulse_ms: 18
        platform_settings:
            recycle_ms: 40
    c_right_kicker:
        number: pio1-5
        default_pulse_ms: 18
        platform_settings:
            recycle_ms: 40
    c_auto_plung:
        number: pio1-3

flippers:
    left_flipper:
        main_coil: c_left_flipper_main
        hold_coil: c_left_flipper_hold
        activation_switch: s_left_flipper
        eos_switch: s_left_flipper_eos
        use_eos: true
    right_flipper:
        main_coil: c_right_flipper_main
        hold_coil: c_right_flipper_hold
        activation_switch: s_right_flipper
        eos_switch: s_right_flipper_eos
        use_eos: true

ball_devices:
    bd_trough:
        ball_switches: s_ball1
        eject_coil: c_ball_trough
        tags: trough, home, drain
        jam_switch: s_ball_jam
        eject_coil_jam_pulse: 15ms
        eject_targets: bd_plunger
    bd_plunger:
        ball_switches: s_auto_plung
        entrance_count_delay: 300ms
        eject_timeouts: 3s
        eject_coil: c_auto_plung
        mechanical_eject: true
        player_controlled_eject_event: s_plunger_active

autofire_coils:
    right_kicker:
        coil: c_right_kicker
        switch: s_right_kicker_upper
        enable_events: machine_reset_phase_3
    right_kicker_lower:
        coil: c_right_kicker
        switch: s_right_kicker_lower
        enable_events: machine_reset_phase_3
    left_kicker:
        coil: c_left_kicker
        switch: s_left_kicker_upper
        enable_events: machine_reset_phase_3
    left_kicker_lower:
        coil: c_left_kicker
        switch: s_left_kicker_lower
        enable_events: machine_reset_phase_3

playfields:
    playfield:
        tags: default
        default_source_device: bd_plunger
    

        