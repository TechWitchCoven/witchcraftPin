#config_version=6

config:
  - config-hardware.yaml
  - config-switches.yaml
  - config-coils.yaml
  - config-modes.yaml
  - lights/config.yaml
  - config-devices.yaml
  - config-multiballs.yaml

playfields:
  playfield:
    tags: default
    default_source_device: bdPlunger

settings:
  replay_score:
    label: Replay replay_score
    values:
      500000: "500000 (default)"
      1000000: "1000000"
      1500000: "1500000"
    default: 500000
    key_type: int
    sort: 100    

virtual_platform_start_active_switches:
  - sBall1
  - sBall2
  - sBall3
  - sBall4
  - sBall5
  - sBall6

show_player:
  init_phase_3:
    led_color:
      show_tokens:
        lights: railLight
        color: 808080

timed_switches:
  game_cancel:
    switch_tags: start
    time: 5s
    events_when_active: end_game